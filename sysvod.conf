# 🧠 Genel limitler
fs.file-max = 3000000
fs.nr_open = 3000000

# 🔍 Inotify (çok sayıda dosya izleme / VOD segment scanning)
fs.inotify.max_user_instances = 1048576
fs.inotify.max_user_watches = 1048576

# 🧩 VM & Memory
vm.max_map_count = 3000000
vm.min_free_kbytes = 2560000
vm.overcommit_memory = 1
vm.swappiness = 1
vm.vfs_cache_pressure = 50
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5
vm.dirty_expire_centisecs = 500
vm.dirty_writeback_centisecs = 100

# 🧮 RAID / mdadm performans ayarları
dev.raid.speed_limit_min = 50000
dev.raid.speed_limit_max = 1000000

# 🌐 TCP / Network
net.core.default_qdisc = fq
net.core.netdev_max_backlog = 300000
net.core.somaxconn = 65535
net.core.rmem_max = 33554432
net.core.wmem_max = 33554432
net.ipv4.ip_local_port_range = 1024 65535

# 🚀 TCP optimizasyon (yüksek bağlantı trafiği + düşük latency)
net.ipv4.tcp_congestion_control = htcp
net.ipv4.tcp_fin_timeout = 5
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_rfc1337 = 1
net.ipv4.tcp_no_metrics_save = 1
net.ipv4.tcp_max_syn_backlog = 65535
net.ipv4.tcp_max_orphans = 3000000
net.ipv4.tcp_max_tw_buckets = 3000000
net.ipv4.tcp_syn_retries = 2
net.ipv4.tcp_synack_retries = 2
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_mtu_probing = 1
net.ipv4.tcp_window_scaling = 1

# 💡 TCP buffer tuning
net.ipv4.tcp_rmem = 4096 87380 33554432
net.ipv4.tcp_wmem = 4096 65535 33554432

# 🧱 Queue & backlog
net.core.optmem_max = 25165824
net.ipv4.tcp_mem = 8388608 12582912 16777216

# 🧰 SYN flood koruma
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_abort_on_overflow = 0

# ⚙️ Reuse / recycle
net.ipv4.tcp_timestamps = 1
net.ipv4.tcp_retries2 = 5

# 🔧 IPv6 (kullanılmıyorsa tamamen kapat)
net.ipv6.conf.all.disable_ipv6 = 1
net.ipv6.conf.default.disable_ipv6 = 1
